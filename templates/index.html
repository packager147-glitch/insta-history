<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaFetch - Media Downloader</title>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col md:flex-row font-sans">

    <!-- Main Downloader Section (Left Side - White Background with Blue Accents) -->
    <main class="flex-1 p-6 md:p-12 flex flex-col justify-center items-center bg-white">
        <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl border border-blue-100">
            <div class="flex items-center gap-3 mb-2">
                <span class="text-3xl">📥</span>
                <h1 class="text-3xl font-extrabold text-blue-600 tracking-tight">
                    InstaFetch
                </h1>
            </div>
            <p class="text-slate-500 text-sm mb-6">Download Instagram Reels, Posts, and Stories directly to your PC.</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Instagram Link</label>
                    <input type="text" id="instaUrl" placeholder="https://instagram.com..." 
                           class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 text-slate-800 text-sm transition">
                </div>
                <button onclick="handleDownload()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition duration-200 cursor-pointer shadow-lg shadow-blue-500/20 active:scale-[0.99]">
                    Download to PC
                </button>
            </div>
        </div>
    </main>

    <!-- Download History Sidebar (Right Side - Blue & Off-White Background) -->
    <aside class="w-full md:w-80 bg-slate-100 border-t md:border-t-0 md:border-l border-blue-100 p-6 flex flex-col h-auto md:h-screen">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
                <span class="text-blue-600">📋</span> Download History
            </h2>
            <span id="historyCount" class="bg-blue-100 text-blue-700 text-xs font-semibold px-2 py-0.5 rounded-full">0 items</span>
        </div>
        
        <!-- Filter/Sorting Options -->
        <div class="mb-4">
            <select id="historyFilter" onchange="sortHistory()" class="w-full bg-white border border-slate-200 text-xs rounded-lg p-2 text-slate-600 focus:outline-none cursor-pointer shadow-sm">
                <option value="newest">Sort by: Newest First</option>
                <option value="creator">Sort by: Creator Name</option>
            </select>
        </div>

        <!-- History Container -->
        <div id="historyList" class="flex-1 overflow-y-auto space-y-3 pr-1 text-sm">
            <p id="emptyState" class="text-center py-8 text-xs text-slate-400 font-medium">No files downloaded yet</p>
        </div>
    </aside>

    <script>
        let historyData = [];

        async function handleDownload() {
            const urlInput = document.getElementById('instaUrl');
            const url = urlInput.value.trim();
            if (!url) return alert('Please paste a valid link!');

            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                const data = await response.json();
                
                if (data.success) {
                    // 1. Add to right side history array
                    historyData.unshift(data.item);
                    urlInput.value = '';
                    sortHistory();

                    // 2. Trigger the direct physical browser file download to PC
                    triggerPCFileDownload(data.item.title);
                } else {
                    alert(data.error || 'Something went wrong');
                }
            } catch (err) {
                console.error("Error executing download layout:", err);
            }
        }

        function triggerPCFileDownload(filename) {
            // Generates a mock container blob (simulating the media content structure)
            const fileContent = "Simulated Instagram Media Data Stream Setup";
            const blob = new Blob([fileContent], { type: "video/mp4" });
            
            // Creates an invisible anchor element to initiate system browser download
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            
            document.body.appendChild(link);
            link.click(); // Triggers native download to local machine
            document.body.removeChild(link);
        }

        function sortHistory() {
            const filterValue = document.getElementById('historyFilter').value;
            if (filterValue === 'creator') {
                historyData.sort((a, b) => a.creator.localeCompare(b.creator));
            } else {
                // Keep timeline setup
            }
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            const emptyState = document.getElementById('emptyState');
            const countLabel = document.getElementById('historyCount');
            
            if (historyData.length === 0) {
                emptyState.style.display = 'block';
                countLabel.innerText = '0 items';
                list.innerHTML = '';
                return;
            }
            
            emptyState.style.display = 'none';
            countLabel.innerText = `${historyData.length} item${historyData.length > 1 ? 's' : ''}`;
            
            list.innerHTML = historyData.map(item => `
                <div class="bg-white p-3 rounded-xl border border-slate-200 flex gap-3 items-center hover:border-blue-300 transition shadow-sm">
                    <img src="${item.preview_url}" alt="Preview" class="w-12 h-12 object-cover rounded-lg bg-slate-100 flex-shrink-0 border border-slate-100">
                    <div class="min-w-0 flex-1">
                        <p class="text-slate-900 font-bold truncate text-xs">${item.creator}</p>
                        <p class="text-[10px] text-slate-400 font-medium mt-0.5">${item.date} • ${item.time}</p>
                        <p class="text-[9px] text-blue-600 font-semibold truncate mt-0.5">💾 ${item.title}</p>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
