<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaFetch - Media Downloader</title>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col md:flex-row">

    <!-- Main Downloader Section (Left Side) -->
    <main class="flex-1 p-6 md:p-12 flex flex-col justify-center items-center">
        <div class="max-w-md w-full bg-slate-800 p-8 rounded-2xl shadow-xl border border-slate-700">
            <h1 class="text-3xl font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-red-500 to-yellow-500">
                InstaFetch
            </h1>
            <p class="text-slate-400 text-sm mb-6">Download Instagram Reels, Posts, and Stories instantly.</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Instagram Link</label>
                    <input type="text" id="instaUrl" placeholder="https://instagram.com..." 
                           class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-pink-500 text-white text-sm">
                </div>
                <button onclick="handleDownload()" class="w-full bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-semibold py-3 px-4 rounded-xl transition duration-200 cursor-pointer shadow-lg shadow-pink-500/20">
                    Download Media
                </button>
            </div>
        </div>
    </main>

    <!-- Download History Sidebar (Right Side) -->
    <aside class="w-full md:w-80 bg-slate-950 border-t md:border-t-0 md:border-l border-slate-800 p-6 flex flex-col h-auto md:h-screen">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-lg font-bold flex items-center gap-2">
                <span>📋</span> Download History
            </h2>
            <span id="historyCount" class="bg-slate-800 text-xs px-2 py-1 rounded-full text-slate-400">0 items</span>
        </div>
        
        <!-- Filter/Sorting Options -->
        <div class="mb-4">
            <select id="historyFilter" onchange="sortHistory()" class="w-full bg-slate-900 border border-slate-800 text-xs rounded-lg p-2 text-slate-400 focus:outline-none cursor-pointer">
                <option value="newest">Sort by: Newest First</option>
                <option value="creator">Sort by: Creator Name</option>
            </select>
        </div>

        <!-- History Container -->
        <div id="historyList" class="flex-1 overflow-y-auto space-y-3 pr-1 text-sm text-slate-400">
            <p id="emptyState" class="text-center py-8 text-xs text-slate-600">No downloads yet</p>
        </div>
    </aside>

    <script>
        let historyData = [];

        async function handleDownload() {
            const urlInput = document.getElementById('instaUrl');
            const url = urlInput.value.trim();
            if (!url) return alert('Please paste a valid link!');

            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                const data = await response.json();
                
                if (data.success) {
                    historyData.unshift(data.item);
                    urlInput.value = '';
                    sortHistory(); // Re-sort and render
                } else {
                    alert(data.error || 'Something went wrong');
                }
            } catch (err) {
                console.error("Error running download:", err);
            }
        }

        function sortHistory() {
            const filterValue = document.getElementById('historyFilter').value;
            
            if (filterValue === 'creator') {
                historyData.sort((a, b) => a.creator.localeCompare(b.creator));
            } else {
                // Default back to timeline order (Newest items added to array front)
            }
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            const emptyState = document.getElementById('emptyState');
            const countLabel = document.getElementById('historyCount');
            
            if (historyData.length === 0) {
                emptyState.style.display = 'block';
                countLabel.innerText = '0 items';
                list.innerHTML = '';
                return;
            }
            
            emptyState.style.display = 'none';
            countLabel.innerText = `${historyData.length} item${historyData.length > 1 ? 's' : ''}`;
            
            list.innerHTML = historyData.map(item => `
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 flex gap-3 items-center hover:border-slate-700 transition animate-fade-in">
                    <img src="${item.preview_url}" alt="Preview" class="w-12 h-12 object-cover rounded-lg bg-slate-800 flex-shrink-0">
                    <div class="min-w-0 flex-1">
                        <p class="text-white font-semibold truncate text-xs">${item.creator}</p>
                        <p class="text-[10px] text-slate-500 mt-0.5">${item.date} • ${item.time}</p>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
